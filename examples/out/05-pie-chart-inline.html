<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pie &amp; Donut Charts</title>
<style>.mdv-doc { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; color: #222; background: #fff; max-width: 860px; margin: 2em auto; padding: 2em 1em; line-height: 1.55; }
body { background: #fff; margin: 0; }
.mdv-doc h1, .mdv-doc h2, .mdv-doc h3, .mdv-doc h4 { color: #111; line-height: 1.25; }
.mdv-doc a { color: #2d6cdf; }
.mdv-doc code { background: rgba(0,0,0,0.06); padding: 0.1em 0.35em; border-radius: 3px; font-size: 0.92em; }
.mdv-doc pre { background: rgba(0,0,0,0.06); padding: 12px; border-radius: 2px; overflow-x: auto; }
.mdv-doc blockquote { border-left: 3px solid #2d6cdf; margin: 1em 0; padding: 0.2em 1em; opacity: 0.85; }
.mdv-doc table.mdv-table, .mdv-doc table { border-collapse: collapse; width: 100%; margin: 1em 0; }
.mdv-doc th, .mdv-doc td { padding: 0.5em 0.8em; border-bottom: 1px solid rgba(0,0,0,0.1); text-align: left; }
.mdv-doc th { font-weight: 600; border-bottom: 2px solid #2d6cdf; }
.mdv-doc .mdv-columns { display: grid; gap: 24px; grid-template-columns: 1fr 1fr; margin: 1em 0; }
.mdv-doc .mdv-error { background: #ffecec; border-left: 4px solid #c64a4a; padding: 12px; margin: 1em 0; font-family: monospace; font-size: 0.9em; color: #5a1a1a; border-radius: 2px; }
.mdv-doc .mdv-warning { background: #fff8e0; border-left: 4px solid #e0b84a; padding: 4px 12px; margin: 0.5em 0; font-size: 0.9em; color: #5a4416; border-radius: 2px; }
.mdv-doc .mdv-chart { margin: 1.2em 0; }
.mdv-doc .mdv-chart-title { font-weight: 600; margin-bottom: 0.5em; font-size: 1.05em; }
.mdv-doc .mdv-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 1em 0; }
.mdv-doc .mdv-stat-card { background: rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.08); border-left: 4px solid #2d6cdf; padding: 12px; border-radius: 2px; }
.mdv-doc .mdv-stat-value { font-size: 1.8em; font-weight: 700; color: #111; line-height: 1.1; }
.mdv-doc .mdv-stat-label { font-size: 0.9em; opacity: 0.75; margin-top: 0.25em; }
.mdv-doc .mdv-stat-delta { font-size: 0.85em; margin-top: 0.4em; font-weight: 600; }
.mdv-doc .mdv-toc { background: rgba(0,0,0,0.03); padding: 12px 24px; border-radius: 2px; margin: 1em 0; }
.mdv-doc .mdv-toc-title { font-weight: 600; margin-bottom: 0.4em; }
.mdv-doc .mdv-toc ul { list-style: none; padding-left: 0; margin: 0; }
.mdv-doc .mdv-toc li { padding: 0.15em 0; }
.mdv-doc .mdv-toc li.mdv-toc-sub { padding-left: 1.5em; font-size: 0.95em; opacity: 0.85; }</style>
</head>
<body>
<article class="mdv-doc">
<h1 id="market-share">Market Share</h1>
<p>Standard pie chart:</p>

<figure class="mdv-chart"><div class="mdv-chart-title">Market share</div><svg viewBox="0 0 520 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"><path d="M 180 180 L 180.0 40.0 A 140 140 0 0 1 223.3 313.1 Z" fill="#2d6cdf"><title>Alpha: 45 (45.0%)</title></path><path d="M 180 180 L 223.3 313.1 A 140 140 0 0 1 40.0 180.0 Z" fill="#e0b84a"><title>Beta: 30 (30.0%)</title></path><path d="M 180 180 L 40.0 180.0 A 140 140 0 0 1 97.7 66.7 Z" fill="#3aa675"><title>Gamma: 15 (15.0%)</title></path><path d="M 180 180 L 97.7 66.7 A 140 140 0 0 1 180.0 40.0 Z" fill="#c64a4a"><title>Delta: 10 (10.0%)</title></path><g transform="translate(360,40)"><rect width="12" height="12" fill="#2d6cdf"/><text x="18" y="10" font-size="12" fill="#222">Alpha (45)</text></g><g transform="translate(360,62)"><rect width="12" height="12" fill="#e0b84a"/><text x="18" y="10" font-size="12" fill="#222">Beta (30)</text></g><g transform="translate(360,84)"><rect width="12" height="12" fill="#3aa675"/><text x="18" y="10" font-size="12" fill="#222">Gamma (15)</text></g><g transform="translate(360,106)"><rect width="12" height="12" fill="#c64a4a"/><text x="18" y="10" font-size="12" fill="#222">Delta (10)</text></g></svg></figure>
<p>Donut variant (add <code>donut</code>):</p>

<figure class="mdv-chart"><div class="mdv-chart-title">Market share (donut)</div><svg viewBox="0 0 520 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"><path d="M 180 180 L 180.0 40.0 A 140 140 0 0 1 223.3 313.1 Z" fill="#2d6cdf"><title>Alpha: 45 (45.0%)</title></path><path d="M 180 180 L 223.3 313.1 A 140 140 0 0 1 40.0 180.0 Z" fill="#e0b84a"><title>Beta: 30 (30.0%)</title></path><path d="M 180 180 L 40.0 180.0 A 140 140 0 0 1 97.7 66.7 Z" fill="#3aa675"><title>Gamma: 15 (15.0%)</title></path><path d="M 180 180 L 97.7 66.7 A 140 140 0 0 1 180.0 40.0 Z" fill="#c64a4a"><title>Delta: 10 (10.0%)</title></path><circle cx="180" cy="180" r="77" fill="#fff"/><g transform="translate(360,40)"><rect width="12" height="12" fill="#2d6cdf"/><text x="18" y="10" font-size="12" fill="#222">Alpha (45)</text></g><g transform="translate(360,62)"><rect width="12" height="12" fill="#e0b84a"/><text x="18" y="10" font-size="12" fill="#222">Beta (30)</text></g><g transform="translate(360,84)"><rect width="12" height="12" fill="#3aa675"/><text x="18" y="10" font-size="12" fill="#222">Gamma (15)</text></g><g transform="translate(360,106)"><rect width="12" height="12" fill="#c64a4a"/><text x="18" y="10" font-size="12" fill="#222">Delta (10)</text></g></svg></figure>
</article>
</body>
</html>
