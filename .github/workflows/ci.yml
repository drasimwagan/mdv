name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # Build in explicit order: @mdv/core first, since @mdv/cli and mdv-vscode depend on it.
      - name: Build core
        run: npm run build --workspace @mdv/core

      - name: Build dependents
        run: |
          npm run build --workspace @mdv/cli
          npm run build --workspace mdv-vscode

      - name: Test
        run: npm test --workspace @mdv/core
