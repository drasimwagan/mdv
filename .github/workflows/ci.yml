name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # Build in explicit order: @mdv/core first, since @mdv/cli and mdv-vscode depend on it.
      - name: Build core
        run: npm run build --workspace @mdv/core

      - name: Build dependents
        run: |
          npm run build --workspace @mdv/cli
          npm run build --workspace mdv-vscode

      - name: Test
        run: npm test --workspace @mdv/core
